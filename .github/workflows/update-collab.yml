name: Update Collaboration Snapshot

# 作用：自动刷新前端「协作 · 进度」页使用的快照 public/data/collab.json
#   - 每 6 小时定时跑一次（防止静态站长期不更新）
#   - 手动在 Actions 页面点击 Run workflow 触发
#   - Issue 有变动（增/改/关/重开/打标签/评论）时即时刷新
# 提交信息带 [skip ci]，避免触发自身的无限循环。

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/**'
      - 'src/**'
      - 'docs/**'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Regenerate collab.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/export-collab.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/collab.json)" ]; then
            git add public/data/collab.json
            git commit -m "chore: refresh collab snapshot [skip ci]"
            git push
          else
            echo "No changes"
          fi
